name: Normalize EXPLORE entry
on:
  push:
    paths:
      - '.github/workflows/normalize-explore-20260822.yml'
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make EXPLORE the real public entry
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('index-core.html')
          s=core.read_text(encoding='utf-8')
          s=s.replace('https://digiy-hub.digiylyfe.com/','https://digiylyfe.com/')
          s=s.replace('🧭 HUB','← DIGIYLYFE.COM')
          if 'data-digiy-return-home="1"' not in s:
              marker='          <div class="hero-actions">'
              button='          <a data-digiy-return-home="1" href="https://digiylyfe.com/" aria-label="Retour DIGIYLYFE.COM" style="width:100%;min-height:52px;display:flex;align-items:center;justify-content:center;margin:18px 0 0;padding:11px 18px;border:2px solid #dcb45a;border-radius:999px;background:#10261e;color:#fff;text-decoration:none;font-weight:1000;font-size:15px;letter-spacing:.02em;box-shadow:0 8px 20px rgba(0,0,0,.22)">← RETOUR DIGIYLYFE.COM</a>\n'
              if marker not in s:
                  raise SystemExit('hero-actions marker not found')
              s=s.replace(marker,button+marker,1)
          if 'digiy-hub.digiylyfe.com' in s:
              raise SystemExit('obsolete HUB link still present')
          core.write_text(s,encoding='utf-8')
          Path('index.html').write_text(s,encoding='utf-8')
          PY
      - name: Commit EXPLORE normalization
        run: |
          git config user.name "DIGIYLYFE"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/normalize-explore-20260822.yml
          git add index.html index-core.html
          git diff --cached --quiet || git commit -m "UI: make EXPLORE the canonical public entry"
          git push
