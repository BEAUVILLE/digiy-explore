<!doctype html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06130f">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://explore.digiylyfe.com/inscription-explore.html">
  <title>Demande EXPLORE — Activation</title>
  <meta name="description" content="DIGIY EXPLORE — accès multilingue direct aux lieux, expériences, fiches et demandes du terrain.">
  <style>
    :root{--bar-h:60px;--bg:#06130f;--gold:#dcb45a;--green:#12b76a;--ink:#f7fbf8;--line:rgba(255,255,255,.15)}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
    .language-shell{height:var(--bar-h);padding:max(7px,env(safe-area-inset-top)) 9px 7px;background:linear-gradient(135deg,#06130f,#0b3024);border-bottom:1px solid rgba(220,180,90,.30);box-shadow:0 8px 28px rgba(0,0,0,.28);position:relative;z-index:20}
    .language-inner{height:100%;display:flex;align-items:center;gap:8px;max-width:1180px;margin:auto;min-width:0}
    .explore-mark{display:flex;align-items:center;gap:8px;flex:0 0 auto;color:#fff2bf;font-weight:1000;font-size:12px;letter-spacing:.04em;white-space:nowrap}
    .explore-mark span{width:35px;height:35px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#f2cc78);color:#062414;font-size:18px}
    .language-buttons{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-end;min-width:0}
    .language-buttons::-webkit-scrollbar{display:none}
    .language-buttons button{flex:0 0 auto;min-height:36px;min-width:54px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:#fff;padding:0 10px;font-weight:1000;font-size:11px;cursor:pointer}
    .language-buttons button.active{background:linear-gradient(135deg,var(--gold),#f2cc78);border-color:rgba(220,180,90,.62);color:#062414;box-shadow:0 6px 16px rgba(0,0,0,.22)}
    .frame-wrap{position:relative;width:100%;height:calc(100dvh - var(--bar-h));background:#06130f}
    #exploreFrame{display:block;width:100%;height:100%;border:0;background:#06130f}
    .loading{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 15% 0%,rgba(220,180,90,.15),transparent 48%),#06130f;color:#fff2bf;font-weight:1000;z-index:2;transition:opacity .18s ease}
    .loading.hidden{opacity:0;pointer-events:none}
    .loading span{padding:18px 22px;border-radius:20px;border:1px solid rgba(220,180,90,.28);background:rgba(255,255,255,.06)}
    html[dir="rtl"] .language-inner{direction:rtl}
    html[dir="rtl"] .language-buttons{justify-content:flex-start}
    @media(max-width:720px){:root{--bar-h:63px}.explore-mark b{display:none}.language-buttons{justify-content:flex-start}.language-buttons button{min-width:51px;padding:0 8px}}
  </style>
  <script src="./explore-i18n-data-1.js?v=20260730-explore7a"></script>
  <script src="./explore-i18n-data-2.js?v=20260730-explore7a"></script>
  <script src="./explore-i18n-data-3.js?v=20260730-explore7a"></script>
  <script src="./explore-i18n-data-4.js?v=20260730-explore7a"></script>
  <script src="./explore-7lang-engine.js?v=20260730-explore7a" defer></script>
  <script src="./explore-world-europe.js?v=20260801-world1" defer></script>
</head>
<body data-page="inscription" data-core="inscription-explore-core.html">
  <header class="language-shell" aria-label="DIGIY EXPLORE languages">
    <div class="language-inner">
      <div class="explore-mark"><span>🌍</span><b>DIGIY EXPLORE</b></div>
      <nav class="language-buttons" aria-label="Choisir la langue">
        <button type="button" data-shell-lang="fr">🇫🇷 FR</button>
        <button type="button" data-shell-lang="en">🇬🇧 EN</button>
        <button type="button" data-shell-lang="es">🇪🇸 ES</button>
        <button type="button" data-shell-lang="de">🇩🇪 DE</button>
        <button type="button" data-shell-lang="it">🇮🇹 IT</button>
        <button type="button" data-shell-lang="nl">🇳🇱 NL</button>
        <button type="button" data-shell-lang="ar">🌙 AR</button>
      </nav>
    </div>
  </header>
  <main class="frame-wrap">
    <div class="loading" id="exploreLoading"><span>DIGIY EXPLORE…</span></div>
    <iframe id="exploreFrame" title="DIGIY EXPLORE" loading="eager" allow="clipboard-read; clipboard-write"></iframe>
  </main>
  <noscript><p><a href="./inscription-explore-core.html">Ouvrir DIGIY EXPLORE</a></p></noscript>
</body>
</html>
